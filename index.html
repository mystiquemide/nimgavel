<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F0E0">
  <meta name="color-scheme" content="light">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #F6F0E0;
      color: #173300;
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app { min-height: 100vh; background: #F6F0E0; }
    .boot-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(240,216,138,.45) 0%, rgba(255,181,27,.15) 35%, transparent 70%),
        #F6F0E0;
    }
    .boot-card { width: min(100%, 720px); text-align: center; }
    .boot-brand { font-weight: 800; letter-spacing: -.02em; font-size: 20px; margin-bottom: 18px; }
    .boot-title { margin: 0; font-size: clamp(34px, 8vw, 58px); line-height: 1.05; font-weight: 800; }
    .boot-copy { max-width: 620px; margin: 18px auto 0; line-height: 1.55; color: #3D4A32; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Nimgavel - Live Community Auction House for Nimiq Pay</title>
  <meta name="description" content="Going once. Going twice. NIM. The live auction floor for Nimiq Pay with free paddles, soft-close showdowns, and direct on-chain settlement.">
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nimgavel: Live auctions in NIM" />
  <meta property="og:description" content="Free bids, pseudonymous paddles, soft-close showdowns. The winner pays the host directly on-chain." />
  <meta property="og:image" content="https://nimgavel.artistic-chip.workers.dev/og.png" />
  <meta property="og:url" content="https://nimgavel.artistic-chip.workers.dev/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nimgavel: Live auctions in NIM" />
  <meta name="twitter:description" content="Free bids, pseudonymous paddles, soft-close showdowns. The winner pays the host directly on-chain." />
  <meta name="twitter:image" content="https://nimgavel.artistic-chip.workers.dev/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Inter:wght@400;500;600;700&family=Reenie+Beanie&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Inter:wght@400;500;600;700&family=Reenie+Beanie&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/compat.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app">
    <main class="boot-shell" aria-label="Loading Nimgavel">
      <div class="boot-card">
        <div class="boot-brand">NIMGAVEL</div>
        <h1 class="boot-title">Live community auctions in NIM.</h1>
        <p class="boot-copy">Create auctions, bid in real time, and settle directly through Nimiq Pay.</p>
      </div>
    </main>
  </div>
  <script type="module" src="/lib/mobile-pay-handoff.js"></script>
  <script type="module" src="/lib/miniapp-compat.js"></script>
  <script type="module" src="/lib/fulfillment-ux.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
