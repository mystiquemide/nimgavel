name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - name: Start local worker
        run: |
          # The worker returns 503 without an auth secret; CI generates one.
          # NIMIQ_RPC_URL points settlement tests at the in-suite mock RPC.
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { randomBytes } from "node:crypto"; writeFileSync(".dev.vars", `NIMGAVEL_SECRET=${randomBytes(32).toString("hex")}\nNIMIQ_RPC_URL=http://127.0.0.1:8899\n`, { mode: 0o600 });'
          npx wrangler d1 migrations apply nimgavel --local
          nohup npx wrangler dev --local --port 8799 --test-scheduled > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8799/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/health

      - name: Run test suite
        env:
          WRANGLER_URL: http://127.0.0.1:8799
        run: node --test --test-timeout=180000 test/*.test.js

      - name: Worker deploy dry-run
        run: npm run worker:check

      - name: Dependency audit
        run: npm audit

      - name: Bundle hygiene
        run: |
          if grep -q "reviewWallet" dist/assets/index-*.js; then
            echo "::error::dev-only reviewWallet hook leaked into the production bundle"
            exit 1
          fi
