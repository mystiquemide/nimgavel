name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - name: Start local worker
        run: |
          # The worker returns 503 without an auth secret; CI generates one.
          # NIMIQ_RPC_URL points settlement tests at the in-suite mock RPC.
          # NIMGAVEL_TEST_MODE bypasses live balance enforcement only for the
          # existing synthetic lifecycle tests; it is never configured in prod.
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { randomBytes } from "node:crypto"; writeFileSync(".dev.vars", `NIMGAVEL_SECRET=${randomBytes(32).toString("hex")}\nNIMIQ_RPC_URL=http://127.0.0.1:8899\nNIMGAVEL_TEST_MODE=1\n`, { mode: 0o600 });'
          npx wrangler d1 migrations apply nimgavel --local
          nohup npx wrangler dev --local --port 8799 --test-scheduled > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8799/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/health

      - name: Run test suite
        env:
          WRANGLER_URL: http://127.0.0.1:8799
        run: node --test --test-timeout=180000 test/*.test.js

      - name: Worker deploy dry-run
        run: npm run worker:check

      - name: Dependency audit
        run: npm audit

      - name: Bundle hygiene
        run: |
          if grep -q "reviewWallet" dist/assets/index-*.js; then
            echo "::error::dev-only reviewWallet hook leaked into the production bundle"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not configured; deployment skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cloudflare.outputs.available == 'true'
        run: npm ci

      - if: steps.cloudflare.outputs.available == 'true'
        run: npm run build:web

      - name: Deploy Cloudflare Worker
        if: steps.cloudflare.outputs.available == 'true'
        run: npx wrangler deploy --keep-vars --var "BUILD_ID:${GITHUB_SHA}"
